name: 不具合報告
description: 不具合報告の内容と再現条件
title: '[Bug] '
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |-
        esp32-povo-2.0に関する内容を、目的と確認できた事実に分けて記載してください。
        Cookie、認証トークン、パスワード、個人情報を本文や添付に含めないでください。認証コード、Wi-Fi認証情報、NVS・全フラッシュのダンプ、個人設定入りファームウェアも添付しないでください。
        投稿前に[README](https://github.com/roflsunriz/esp32-povo-2.0/blob/main/README.md)と[既存Issue](https://github.com/roflsunriz/esp32-povo-2.0/issues)を確認してください。
        脆弱性の報告は[SECURITY.md](https://github.com/roflsunriz/esp32-povo-2.0/blob/main/SECURITY.md)の案内に従ってください。
  - type: checkboxes
    id: preflight
    attributes:
      label: 事前確認
      options:
        - label: 既存Issueを検索しました。
          required: false
        - label: 可能な範囲で最新の公開版でも確認しました。
          required: false
  - type: textarea
    id: legacy-1
    attributes:
      label: 概要
    validations:
      required: false
  - type: textarea
    id: legacy-3
    attributes:
      label: 環境・検証結果
      description: 秘密情報や個人設定入りファームウェアを添付しないでください。
    validations:
      required: false
  - type: textarea
    id: environment-common
    attributes:
      label: 対象と環境
      description: 対象機能、使用中の版またはコミット、OSと実行環境を記載してください。
    validations:
      required: false
  - type: textarea
    id: legacy-2
    attributes:
      label: 再現手順
    validations:
      required: false
  - type: textarea
    id: expected-common
    attributes:
      label: 期待した結果
    validations:
      required: false
  - type: textarea
    id: actual-common
    attributes:
      label: 実際の結果
      description: 観測した症状とエラーメッセージを記載してください。
    validations:
      required: false
  - type: textarea
    id: diagnostics-common
    attributes:
      label: 診断情報
      description: 秘密情報を除いたログや画面を添付してください。
    validations:
      required: false
  - type: textarea
    id: additional-common
    attributes:
      label: 補足
      description: 発生頻度、直前の変更、回避策、確認できない条件を記載してください。
    validations:
      required: false
  - type: checkboxes
    id: privacy
    attributes:
      label: 公開情報の確認
      options:
        - label: 本文と添付に秘密情報や個人情報が含まれていないことを確認しました。
          required: true
