name: 文書の改善
description: 文書の改善の内容と再現条件
title: '[Docs] '
labels:
  - documentation
body:
  - type: markdown
    attributes:
      value: |-
        esp32-povo-2.0に関する内容を、目的と確認できた事実に分けて記載してください。
        Cookie、認証トークン、パスワード、個人情報を本文や添付に含めないでください。認証コード、Wi-Fi認証情報、NVS・全フラッシュのダンプ、個人設定入りファームウェアも添付しないでください。
        投稿前に[README](https://github.com/roflsunriz/esp32-povo-2.0/blob/main/README.md)と[既存Issue](https://github.com/roflsunriz/esp32-povo-2.0/issues)を確認してください。
        脆弱性の報告は[SECURITY.md](https://github.com/roflsunriz/esp32-povo-2.0/blob/main/SECURITY.md)の案内に従ってください。
  - type: textarea
    id: legacy-1
    attributes:
      label: 現在の記載と問題
    validations:
      required: false
  - type: textarea
    id: legacy-2
    attributes:
      label: 確認した手順と期待する記載
    validations:
      required: false
  - type: textarea
    id: legacy-3
    attributes:
      label: 環境・検証結果
      description: 秘密情報や個人設定入りファームウェアを添付しないでください。
    validations:
      required: false
  - type: textarea
    id: location-common
    attributes:
      label: 対象文書・箇所
      description: ファイル名またはURLと見出し・手順番号を記載してください。
    validations:
      required: false
  - type: textarea
    id: additional-common
    attributes:
      label: 補足
      description: 根拠となる資料や、試した環境と結果を記載してください。
    validations:
      required: false
  - type: checkboxes
    id: privacy
    attributes:
      label: 公開情報の確認
      options:
        - label: 本文と添付に秘密情報や個人情報が含まれていないことを確認しました。
          required: true
