name: Release source
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install platformio
      - run: pio run -e cyd
      - run: cmake -S . -B build && cmake --build build && ctest --test-dir build --output-on-failure
      - name: Extract notes and package tracked source
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python scripts/release-notes.py "$RELEASE_TAG" > release-notes.md
          git archive --format=zip --output=povo-cyd-source.zip HEAD
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" povo-cyd-source.zip --notes-file release-notes.md
