name: Checks
on: [push, pull_request]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - name: Cache PlatformIO toolchains
        uses: actions/cache@v6
        with:
          path: ~/.platformio
          key: ${{ runner.os }}-platformio-${{ hashFiles('platformio.ini', 'requirements-ci.txt') }}
          restore-keys: |
            ${{ runner.os }}-platformio-
      - run: pip install --no-deps -r requirements-ci.txt
      - run: python test/audit-test.py && python test/capture-auth-test.py && python scripts/audit-build-tools.py
      - run: pio run -e cyd
      - run: cmake -S . -B build && cmake --build build && ctest --test-dir build --output-on-failure
      - run: node test/portal-test.mjs
      - run: python scripts/generate-font.py && git diff --exit-code -- include/japanese-font.h
